<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お題ルーレット</title>
    <style>
      :root {
        --ball-red: #ee2a2a;
        --ball-red-dark: #b81c1c;
        --ball-black: #262626;
        --panel: #fffdf8;
        --bg: #fff3e6;
        --text: #2c2c2c;
        --muted: #7a6f68;
        --border: rgba(38, 38, 38, 0.14);
        --border-red: rgba(238, 42, 42, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(rgba(238, 42, 42, 0.06) 8%, transparent 9%),
          radial-gradient(rgba(38, 38, 38, 0.045) 8%, transparent 9%), var(--bg);
        background-position:
          0 0,
          30px 30px;
        background-size: 60px 60px;
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .app {
        width: min(900px, 100%);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0 0 22px;
      }

      .title {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 900;
        letter-spacing: 0.04em;
        text-align: center;
        color: var(--ball-black);
      }

      .card {
        overflow: hidden;
        background: var(--panel);
        border: 2px solid var(--ball-black);
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(38, 20, 10, 0.16);
      }

      .card-band {
        height: 14px;
        background: linear-gradient(
          to bottom,
          var(--ball-red),
          var(--ball-red-dark)
        );
        border-bottom: 2px solid var(--ball-black);
      }

      .input-area {
        padding: 22px;
      }

      .divider {
        height: 6px;
        background: var(--ball-black);
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 800;
        color: var(--ball-black);
      }

      textarea,
      input[type="number"] {
        border: 2px solid var(--border);
        border-radius: 16px;
        outline: none;
        background: #fffefb;
        color: var(--text);
        font: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 14px 16px;
        font-size: 16px;
        line-height: 1.55;
      }

      textarea:focus,
      input[type="number"]:focus {
        border-color: var(--ball-red);
        box-shadow: 0 0 0 4px rgba(238, 42, 42, 0.14);
      }

      .options-row {
        display: flex;
        align-items: end;
        gap: 16px;
        margin-top: 18px;
      }

      .count-field {
        width: 180px;
      }

      .count-field label {
        margin-bottom: 8px;
      }

      input[type="number"] {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        font-size: 18px;
        font-weight: 800;
      }

      .count-note {
        padding-bottom: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .result-area {
        padding: 26px 22px 24px;
      }

      .result-title {
        margin-bottom: 16px;
        color: var(--ball-black);
        text-align: center;
        font-size: 14px;
        font-weight: 800;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
        gap: 8px;
        min-height: 120px;
      }

      .empty-state,
      .loading-state {
        grid-column: 1 / -1;
        min-height: 120px;
        display: grid;
        place-items: center;
        gap: 10px;
        padding: 24px;
        border: 2px dashed var(--border-red);
        border-radius: 20px;
        background: rgba(255, 243, 230, 0.55);
        color: var(--muted);
        text-align: center;
        font-size: 15px;
        font-weight: 700;
      }

      .result-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px 8px 8px;
        border: 2px solid var(--border-red);
        border-radius: 999px;
        background: #fffefb;
        box-shadow: 0 6px 16px rgba(238, 42, 42, 0.08);
        text-align: left;
      }

      .result-text {
        flex: 1;
        width: 100%;
        overflow-wrap: anywhere;
        font-size: clamp(12px, 2.6vw, 16px);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: var(--ball-black);
      }

      /* --- モンスターボールアイコン --- */
      .pokeball-icon {
        position: relative;
        flex: 0 0 auto;
        border-radius: 50%;
        background: linear-gradient(
          to bottom,
          var(--ball-red) 0%,
          var(--ball-red) 48%,
          var(--ball-black) 48%,
          var(--ball-black) 52%,
          #fff 52%,
          #fff 100%
        );
        border: 2px solid var(--ball-black);
      }

      .pokeball-icon::before {
        content: "";
        position: absolute;
        top: 15%;
        left: 20%;
        width: 22%;
        height: 12%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
      }

      .pokeball-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 42%;
        height: 42%;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--ball-black);
        color: var(--ball-black);
        font-weight: 950;
        font-size: 10px;
      }

      .title-icon {
        width: 36px;
        height: 36px;
      }

      .result-badge {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--ball-red);
        color: #fff;
        font-weight: 900;
        font-size: 12px;
      }

      .loading-icon {
        width: 72px;
        height: 72px;
      }

      .loading-icon.pokeball-icon--shake {
        animation: pokeball-shake 0.9s ease-in-out infinite;
      }

      @keyframes pokeball-shake {
        0%,
        100% {
          transform: rotate(0deg);
        }
        10% {
          transform: rotate(-18deg);
        }
        20% {
          transform: rotate(14deg);
        }
        30% {
          transform: rotate(-12deg);
        }
        40% {
          transform: rotate(10deg);
        }
        50% {
          transform: rotate(-6deg);
        }
        60% {
          transform: rotate(6deg);
        }
        70% {
          transform: rotate(-3deg);
        }
        80% {
          transform: rotate(3deg);
        }
        90% {
          transform: rotate(0deg);
        }
      }
      /* --- /モンスターボールアイコン --- */

      .message {
        min-height: 24px;
        margin: 16px 0 12px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      .message.error {
        color: var(--ball-red-dark);
        font-weight: 800;
      }

      .controls {
        display: flex;
        justify-content: center;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: min(360px, 100%);
        min-height: 58px;
        border: 3px solid var(--ball-black);
        border-radius: 999px;
        cursor: pointer;
        color: #fffdf4;
        background: var(--ball-red);
        font: inherit;
        font-size: 20px;
        font-weight: 950;
        letter-spacing: 0.12em;
        box-shadow: 0 10px 24px rgba(184, 28, 28, 0.32);
        transition:
          transform 0.12s ease,
          filter 0.2s ease;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      button:active:not(:disabled) {
        transform: translateY(1px) scale(0.995);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }

      @media (max-width: 620px) {
        .input-area,
        .result-area {
          padding-left: 16px;
          padding-right: 16px;
        }

        .options-row {
          align-items: stretch;
          flex-direction: column;
          gap: 7px;
        }

        .count-field {
          width: 100%;
        }

        .count-note {
          padding-bottom: 0;
        }

        .results-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

          >

          <div class="options-row">
            <div class="count-field">
              <label for="pickCount">選ぶ個数</label>
              <input
                id="pickCount"
                type="number"
                min="1"
                value="10"
                inputmode="numeric"
              />
            </div>
            <div class="count-note" id="countNote">
              現在の候補から最大 5 個まで選べます。
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="result-area">
          <div class="result-title">選択結果</div>

          <div class="results-grid" id="resultsGrid">
            <div class="empty-state">
              <div class="pokeball-icon">
                <span class="pokeball-button"></span>
              </div>
              <div>スタートを押すと、選ばれた候補がここに並びます。</div>
            </div>
          </div>

          <div class="message" id="message">
            候補と選ぶ個数を設定してください。
          </div>

          <div class="controls">
            <button id="startButton" type="button">スタート</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const textarea = document.getElementById("candidates");
        const pickCountInput = document.getElementById("pickCount");
        const countNote = document.getElementById("countNote");
        const resultsGrid = document.getElementById("resultsGrid");
        const message = document.getElementById("message");
        const startButton = document.getElementById("startButton");

        function getCandidateWeights() {
          const lines = textarea.value
            .split(/\r?\n/)
            .map((value) => value.trim())
            .filter(Boolean);

          const weights = new Map();

          for (const value of lines) {
            weights.set(value, (weights.get(value) || 0) + 1);
          }

          return Array.from(weights, ([text, weight]) => ({ text, weight }));
        }

        function randomInt(max) {
          if (!Number.isInteger(max) || max <= 0) {
            throw new Error("max must be a positive integer");
          }

          if (window.crypto && crypto.getRandomValues) {
            const range = 0x100000000;
            const limit = range - (range % max);
            const buffer = new Uint32Array(1);
            let value;

            do {
              crypto.getRandomValues(buffer);
              value = buffer[0];
            } while (value >= limit);

            return value % max;
          }

          return Math.floor(Math.random() * max);
        }

        // 重み付き・重複なし抽選
        function weightedSampleWithoutReplacement(entries, count) {
          const pool = entries.map((item) => ({ ...item }));
          const picked = [];

          while (picked.length < count && pool.length > 0) {
            const totalWeight = pool.reduce(
              (sum, item) => sum + item.weight,
              0,
            );
            let target = randomInt(totalWeight);

            let selectedIndex = 0;

            for (let i = 0; i < pool.length; i++) {
              if (target < pool[i].weight) {
                selectedIndex = i;
                break;
              }
              target -= pool[i].weight;
            }

            picked.push(pool[selectedIndex].text);
            pool.splice(selectedIndex, 1);
          }

          return picked;
        }

        function updateCountInfo() {
          const max = getCandidateWeights().length;
          pickCountInput.max = String(Math.max(1, max));

          if (max === 0) {
            countNote.textContent = "候補を入力してください。";
            return;
          }

          countNote.textContent = `現在の候補から最大 ${max} 個まで選べます。`;

          const current = Number.parseInt(pickCountInput.value, 10) || 1;
          if (current > max) {
            pickCountInput.value = String(max);
          }
        }

        function showError(text) {
          message.className = "message error";
          message.textContent = text;
        }

        function renderResults(winners) {
          resultsGrid.innerHTML = "";

          winners.forEach((winner, index) => {
            const card = document.createElement("div");
            card.className = "result-card";

            const badge = document.createElement("div");
            badge.className = "result-badge";
            badge.textContent = String(index + 1);

            const text = document.createElement("div");
            text.className = "result-text";
            text.textContent = winner;

            card.append(badge, text);
            resultsGrid.appendChild(card);
          });

          message.className = "message";
          message.textContent = `${winners.length} 個を選択しました。`;
        }

        function showLoading() {
          resultsGrid.innerHTML = `
      <div class="loading-state">
        <div class="pokeball-icon loading-icon pokeball-icon--shake"><span class="pokeball-button"></span></div>
        <div>抽選中...</div>
      </div>
    `;
        }

        function startSelection() {
          const entries = getCandidateWeights();

          if (entries.length === 0) {
            showError("候補を1つ以上入力してください。");
            textarea.focus();
            return;
          }

          const count = Number.parseInt(pickCountInput.value, 10);

          if (!Number.isInteger(count) || count < 1) {
            showError("選ぶ個数は1以上の整数で指定してください。");
            pickCountInput.focus();
            return;
          }

          if (count > entries.length) {
            showError(
              `選ぶ個数は、異なる候補数（${entries.length}個）以下にしてください。`,
            );
            pickCountInput.focus();
            return;
          }

          startButton.disabled = true;
          message.className = "message";
          message.textContent = "";
          showLoading();

          window.setTimeout(() => {
            const winners = weightedSampleWithoutReplacement(entries, count);
            renderResults(winners);
            startButton.disabled = false;
          }, 1300);
        }

        textarea.addEventListener("input", updateCountInfo);

        pickCountInput.addEventListener("change", () => {
          const max = getCandidateWeights().length;
          let value = Number.parseInt(pickCountInput.value, 10) || 1;

          value = Math.max(1, value);
          if (max > 0) {
            value = Math.min(value, max);
          }

          pickCountInput.value = String(value);
        });

        startButton.addEventListener("click", startSelection);

        updateCountInfo();
      })();
    </script>
  </body>
</html>
